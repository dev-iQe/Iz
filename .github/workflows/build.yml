name: Build Store App

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-13
    timeout-minutes: 20

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Homebrew Path
      run: echo "/opt/homebrew/bin" >> $GITHUB_PATH

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode Project
      run: xcodegen generate

    - name: Build App
      run: |
        xcodebuild -project StoreSigner.xcodeproj \
                   -scheme StoreSigner \
                   -sdk iphoneos \
                   -configuration Release \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_ALLOWED=NO \
                   archive -archivePath build/StoreSigner.xcarchive

    - name: Create IPA Package
      run: |
        mkdir -p build/Payload
        cp -r build/StoreSigner.xcarchive/Products/Applications/*.app build/Payload/
        cd build && zip -r StoreSigner.ipa Payload

    - name: Export Artifact (Download IPA)
      uses: actions/upload-artifact@v4
      with:
        name: StoreSigner-App
        path: build/StoreSigner.ipa
